<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minha página</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f8f7fb;
      color: #1c1a24;
    }
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 48px 16px;
    }
    h1 { font-size: 32px; margin: 0 0 8px; }
    p  { line-height: 1.6; color: #4a4658; }
    .botao {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 20px;
      border-radius: 12px;
      background: #7c3aed;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }
    .botao:hover { background: #6d28d9; }
  </style>
</head>
<body>
  <main>
    <h1>Olá! 👋</h1>
    <p>Esta é uma página HTML simples. Troque este texto pelo que você quiser.</p>
    <a class="botao" href="#" onclick="alert('Funcionou!'); return false;">Clique aqui</a>
  </main>
</body>
</html>
