<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recorte</title>
  <style>
    :root { --bg: #f6f5f2; --fg: #1d1c1a; --muted: #6b6862; --card: #fff; --line: #e2dfd8; --accent: #e8452c; }
    @media (prefers-color-scheme: dark) { :root { --bg: #141413; --fg: #efede8; --muted: #a3a09a; --card: #1f1e1c; --line: #34322e; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 860px; margin: 0 auto; padding: 32px 16px 64px; }
    h1 { margin: 0 0 4px; font-size: 28px; }
    .sub { color: var(--muted); margin: 0 0 24px; }
    form { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: grid; gap: 16px; }
    .row { display: flex; flex-wrap: wrap; gap: 16px; }
    label { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
    input, select, button { font: inherit; }
    input[type=file], select, input[type=password] { padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); }
    button { padding: 12px 20px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .5; cursor: wait; }
    #status { margin: 20px 0; color: var(--muted); white-space: pre-line; min-height: 1.5em; }
    #clips { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .clip { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 8px; }
    .clip video { width: 100%; aspect-ratio: 9 / 16; background: #000; border-radius: 8px; }
    .clip h3 { margin: 0; font-size: 16px; }
    .clip p { margin: 0; font-size: 13px; color: var(--muted); }
    .clip a { color: var(--accent); font-weight: 600; }
  </style>
</head>
<body>
<main>
  <h1>Recorte</h1>
  <p class="sub">Envie um vídeo longo e receba cortes verticais com legenda, prontos para Reels, TikTok e Shorts. O vídeo fica no seu computador: só o texto falado vai para a IA.</p>

  <form id="form">
    <label>Vídeo <input type="file" id="file" accept="video/*" required></label>
    <div class="row">
      <label>Quantos cortes
        <select id="count"><option>1</option><option>2</option><option selected>3</option><option>5</option><option>8</option></select>
      </label>
      <label>Idioma falado
        <select id="lang"><option value="portuguese" selected>Português</option><option value="english">Inglês</option><option value="spanish">Espanhol</option><option value="">Detectar</option></select>
      </label>
      <label>Código de acesso (se houver)
        <input type="password" id="code" autocomplete="off">
      </label>
    </div>
    <button id="go">Gerar cortes</button>
  </form>

  <div id="status" role="status" aria-live="polite"></div>
  <div id="clips"></div>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
