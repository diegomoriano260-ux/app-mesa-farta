<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f5f2">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141413">
  <meta name="color-scheme" content="light dark">
  <title>Recorte</title>
  <style>
    :root { --bg: #f6f5f2; --fg: #1d1c1a; --muted: #6b6862; --card: #fff; --line: #e2dfd8; --accent: #e8452c; --ease-out: cubic-bezier(0.23, 1, 0.32, 1); }
    @media (prefers-color-scheme: dark) { :root { --bg: #141413; --fg: #efede8; --muted: #a3a09a; --card: #1f1e1c; --line: #34322e; } }
    * { box-sizing: border-box; }
    html { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 860px; margin: 0 auto; padding: 32px max(16px, env(safe-area-inset-right, 0px)) calc(64px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
    button, a, select, input[type=file] { touch-action: manipulation; }
    button { user-select: none; -webkit-user-select: none; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    h1 { margin: 0 0 4px; font-size: 28px; }
    .sub { color: var(--muted); margin: 0 0 24px; }
    form { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: grid; gap: 16px; }
    .row { display: flex; flex-wrap: wrap; gap: 16px; }
    label { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
    input, select, button { font: inherit; }
    input[type=file], select, input[type=password] { padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); }
    input[type=file], select { font-size: 16px; }
    form { grid-template-columns: minmax(0, 1fr); }
    form > label > select, form > label > input { width: 100%; min-width: 0; }
    button { padding: 12px 20px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; transition: transform 160ms var(--ease-out), opacity 200ms ease, filter 150ms ease; }
    button:active:not(:disabled) { transform: scale(0.97); }
    button:disabled { opacity: .5; cursor: wait; }
    @media (hover: hover) and (pointer: fine) {
      button:hover:not(:disabled) { filter: brightness(1.08); }
      .clip a:hover, #summary .downloads a:hover { text-decoration-thickness: 2px; }
    }
    #status { margin: 20px 0; color: var(--muted); white-space: pre-line; min-height: 1.5em; display: flex; gap: 10px; align-items: flex-start; }
    #status.busy::before { content: ""; flex: none; width: 14px; height: 14px; margin-top: 5px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 600ms linear infinite; }
    #status.error { color: var(--accent); }
    @keyframes spin { to { transform: rotate(360deg); } }
    #clips { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .clip { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 8px; }
    .clip, #summary:not(:empty) { transition: opacity 300ms var(--ease-out), transform 300ms var(--ease-out); }
    @starting-style { .clip, #summary:not(:empty) { opacity: 0; transform: translateY(8px); } }
    @media (prefers-reduced-motion: reduce) {
      @starting-style { .clip, #summary:not(:empty) { transform: none; } }
      #status.busy::before { animation-duration: 1.5s; }
      button:active:not(:disabled) { transform: none; }
    }
    .clip video { width: 100%; aspect-ratio: 9 / 16; background: #000; border-radius: 8px; }
    .clip h3 { margin: 0; font-size: 16px; }
    .clip p { margin: 0; font-size: 13px; color: var(--muted); }
    .clip a { color: var(--accent); font-weight: 600; }
    [hidden] { display: none !important; }
    #summary:empty { display: none; }
    #summary { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
    #summary h2 { margin: 0 0 8px; }
    #summary h3 { margin: 24px 0 8px; font-size: 18px; }
    #summary h4 { margin: 12px 0 4px; font-size: 15px; }
    #summary ul { margin: 0; padding-left: 20px; }
    #summary .muted { color: var(--muted); }
    #summary .downloads a { color: var(--accent); font-weight: 600; margin-right: 16px; }
    #summary pre { white-space: pre-wrap; font-size: 13px; color: var(--muted); max-height: 400px; overflow: auto; }
  </style>
</head>
<body>
<main>
  <h1>Recorte</h1>
  <p class="sub">Transforme um vídeo longo em cortes verticais com legenda para Reels, TikTok e Shorts, ou a gravação de uma reunião em resumo, decisões e tarefas. O arquivo fica no seu computador: só o texto falado vai para a IA.</p>

  <form id="form">
    <label>O que fazer
      <select id="mode"><option value="clips" selected>Cortes para redes sociais</option><option value="summary">Resumo de reunião</option></select>
    </label>
    <label>Vídeo ou áudio <input type="file" id="file" accept="video/*,audio/*" required></label>
    <div class="row">
      <label id="countField">Quantos cortes
        <select id="count"><option>1</option><option>2</option><option selected>3</option><option>5</option><option>8</option></select>
      </label>
      <label>Idioma falado
        <select id="lang"><option value="portuguese" selected>Português</option><option value="english">Inglês</option><option value="spanish">Espanhol</option><option value="">Detectar</option></select>
      </label>
      <label>Código de acesso (se houver)
        <input type="password" id="code" autocomplete="off">
      </label>
    </div>
    <button id="go">Gerar cortes</button>
  </form>

  <div id="status" role="status" aria-live="polite"></div>
  <div id="summary"></div>
  <div id="clips"></div>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
